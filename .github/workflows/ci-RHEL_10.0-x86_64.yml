name: RHEL 10.0 (x86_64) CI
env:
  CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # mull-runner/mull-reporter don't depend on LLVM; any of the CI images can build them
  tools:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    name: RHEL 10.0 - tools
    outputs:
      published-version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/detect-package-metadata
      - name: Determine package version
        id: version
        if: env.CLOUDSMITH_API_KEY != null
        run: echo "version=$(infrastructure/workspace_status.sh | awk '$1 == "STABLE_MULL_VERSION" { print $2 }')" >> $GITHUB_OUTPUT
      - uses: ./.github/actions/setup-bazel-cache
        with:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          PLATFORM: rhel-10.0-x86_64
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and package
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/mull-project/internal-rhel-x86_64_10.0-llvm-21-ci
          configFile: ./.devcontainer/rhel_10.0-llvm-21/devcontainer.json
          runCmd: |
            set -e
            mkdir -p packages
            bazel build //:mull_tools_packages --stamp
            mv -v bazel-bin/Mull-*.rpm packages/
      - name: Publish package
        uses: devcontainers/ci@v0.3
        if: env.CLOUDSMITH_API_KEY != null
        with:
          imageName: ghcr.io/mull-project/internal-rhel-x86_64_10.0-llvm-21-ci
          configFile: ./.devcontainer/rhel_10.0-llvm-21/devcontainer.json
          push: never
          env: CLOUDSMITH_API_KEY
          runCmd: |
            bazel run publish_tools --stamp && exit 0

            max_attempts=3
            attempt=1
            until [ "$attempt" -ge "$max_attempts" ]
            do
              echo "Attempt $attempt failed. Retrying..."
              attempt=$((attempt+1))
              bazel run publish_tools --stamp && exit 0
            done
            echo "All $max_attempts attempts failed."
            exit 1
      - name: Move package
        run: |
          mkdir -p /tmp/packages
          sudo mv -v packages/Mull-*.rpm /tmp/packages/
      - uses: actions/upload-artifact@v4
        with:
          name: packages-tools
          path: /tmp/packages/
          retention-days: 7
      - uses: ./.github/actions/attach-package
        with:
          GH_API_KEY: ${{ secrets.GITHUB_TOKEN }}
  build-and-test:
    # mull-N packages depend on the exact mull version, so publish them only after it
    needs: [tools]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        LLVM_VERSION: [21]
    name: RHEL 10.0 - LLVM ${{ matrix.LLVM_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/detect-package-metadata
      - uses: ./.github/actions/setup-bazel-cache
        with:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          PLATFORM: rhel-10.0-x86_64
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test, package
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/mull-project/internal-rhel-x86_64_10.0-llvm-${{ matrix.LLVM_VERSION }}-ci
          configFile: ./.devcontainer/rhel_10.0-llvm-${{ matrix.LLVM_VERSION }}/devcontainer.json
          runCmd: |
            set -e
            mkdir -p packages
            bazel test //... || { cp -RL bazel-testlogs ci-testlogs; exit 1; }
            bazel build //:mull_llvm_packages --stamp
            # `bazel test` also builds an unstamped mull package, which must not overwrite the one from the tools job
            mv -v bazel-bin/Mull-${{ matrix.LLVM_VERSION }}-*.rpm packages/
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs-rhel-10.0-x86_64-llvm-${{ matrix.LLVM_VERSION }}
          path: ci-testlogs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish package
        uses: devcontainers/ci@v0.3
        if: env.CLOUDSMITH_API_KEY != null && needs.tools.result == 'success'
        with:
          imageName: ghcr.io/mull-project/internal-rhel-x86_64_10.0-llvm-${{ matrix.LLVM_VERSION }}-ci
          configFile: ./.devcontainer/rhel_10.0-llvm-${{ matrix.LLVM_VERSION }}/devcontainer.json
          push: never
          env: CLOUDSMITH_API_KEY
          runCmd: |
            bazel run publish --stamp && exit 0

            max_attempts=3
            attempt=1
            until [ "$attempt" -ge "$max_attempts" ]
            do
              echo "Attempt $attempt failed. Retrying..."
              attempt=$((attempt+1))
              bazel run publish --stamp && exit 0
            done
            echo "All $max_attempts attempts failed."
            exit 1
      - name: Move package
        run: |
          mkdir -p /tmp/packages
          sudo mv -v packages/Mull-*.rpm /tmp/packages/
      - uses: actions/upload-artifact@v4
        with:
          name: packages-llvm-${{ matrix.LLVM_VERSION }}
          path: /tmp/packages/
          retention-days: 7
      - uses: ./.github/actions/attach-package
        with:
          GH_API_KEY: ${{ secrets.GITHUB_TOKEN }}
  smoke-test:
    needs: [tools, build-and-test]
    if: ${{ !cancelled() && needs.tools.result == 'success' && needs.build-and-test.result == 'success' }}
    runs-on: ubuntu-26.04
    name: Smoke test
    container:
      image: redhat/ubi10:10.0
    steps:
      - name: Install prerequisites
        run: true
      - uses: actions/download-artifact@v4
        with:
          name: packages-tools
          path: packages/tools
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-llvm-*
          path: packages/llvm
          merge-multiple: true
      - name: Install and test all mull packages
        run: |
          dnf install -y ./packages/tools/Mull-*.rpm
          runner_version=$(mull-runner --version)
          echo "$runner_version"
          if echo "$runner_version" | grep -q '{STABLE_'; then
            echo "ERROR: mull-runner contains unexpanded stamp variable"
            exit 1
          fi

          reporter_version=$(mull-reporter --version)
          echo "$reporter_version"
          if echo "$reporter_version" | grep -q '{STABLE_'; then
            echo "ERROR: mull-reporter contains unexpanded stamp variable"
            exit 1
          fi

          for version in 21; do
            echo "=== Testing LLVM $version ==="
            dnf install -y ./packages/llvm/Mull-$version-*.rpm

            plugins=$(mull-runner --version)
            echo "$plugins"
            if ! echo "$plugins" | grep -q "mull-ir-frontend-$version (mull [0-9]"; then
              echo "ERROR: mull-runner does not list a stamped mull-ir-frontend-$version"
              exit 1
            fi

            # Deprecated versioned names, kept as symlinks
            mull-runner-$version --version
            mull-reporter-$version --version
          done
      # Reinstalling the exact versions forces downloading them from Cloudsmith
      - name: Install mull packages from Cloudsmith
        if: needs.tools.outputs.published-version != ''
        shell: bash
        env:
          MULL_VERSION: ${{ needs.tools.outputs.published-version }}
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            pull_request:*) cs_repo=testing ;;
            *:refs/tags/*) cs_repo=stable ;;
            *) cs_repo=nightly ;;
          esac
          packages=mull-$MULL_VERSION
          for version in 21; do
            packages="$packages mull-$version-$MULL_VERSION"
          done
          set -o pipefail
          if ! (curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-$cs_repo/setup.rpm.sh" | bash && dnf reinstall -y --setopt="mull-project*.skip_if_unavailable=False" $packages) 2>&1 | tee cloudsmith.log; then
            # 402: the Cloudsmith quota is exhausted, which isn't something this run can fix
            if grep -qE '402 +Payment Required|Status code: 402' cloudsmith.log; then
              echo "::warning title=Cloudsmith unavailable::mull-$cs_repo returns 402 Payment Required, packages can't be installed from Cloudsmith"
              exit 0
            fi
            exit 1
          fi
          plugins=$(mull-runner --version)
          echo "$plugins"
          for version in 21; do
            if ! echo "$plugins" | grep -q "mull-ir-frontend-$version (mull [0-9]"; then
              echo "ERROR: mull-runner does not list mull-ir-frontend-$version"
              exit 1
            fi
          done
